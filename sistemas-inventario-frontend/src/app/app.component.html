<div class="header-superior" *ngIf="isLoggedIn">
  <div class="menu-izquierda">
    <a (click)="menuMinMax()" class="boton-menu-header">
      <mat-icon>menu</mat-icon>
    </a>
    <span>Menu</span>
  </div>
  <div class="menu-derecha">
    <span class="nombre-usuario"> {{ rolUsuario | uppercase }} &nbsp;&nbsp; - &nbsp;&nbsp; DEPARTAMENTO SISTEMAS</span>
  </div>
</div>

<!-- Contenedor principal con menú lateral y contenido (debajo del header) -->
<div class="contenido-principal">
  <div class="contenido-inventario-sistemas" [class.con-menu]="isLoggedIn"
    [class.menu-minimizado]="isLoggedIn && menuMinimizado">
    <div *ngIf="isLoggedIn" class="menu">
      <app-menu></app-menu>
    </div>
    <div class="pagina-dinamica">
      <div class="contenido">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
